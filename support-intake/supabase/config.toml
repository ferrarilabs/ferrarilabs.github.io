# Projeto Supabase DEDICADO ao intake de reportes (Issue #321, ameaca T-ENV-01).
#
# ─── POR QUE UM PROJETO SEPARADO ────────────────────────────────────────────────────────────────
#
# O Supabase injeta capacidades de projeto em TODA Edge Function hospedada: `SUPABASE_DB_URL`,
# `SUPABASE_SECRET_KEYS` e o legado `SUPABASE_SERVICE_ROLE_KEY` -- este ultimo IGNORA RLS.
#
# Enquanto o intake publico e nao autenticado rodasse no mesmo projeto dos dados de participante,
# pagamento, scoring e ranking, a frase "um comprometimento do intake nao alcanca participante"
# seria uma afirmacao sobre o nosso codigo, nao sobre a plataforma. Catraca de CI protege contra uso
# ACIDENTAL; nao protege contra dependencia comprometida, execucao no runtime, defeito de injecao
# futuro nem cadeia de suprimentos. O ambiente continua contendo credencial de alto valor.
#
# Aqui, o segredo que o Supabase injetar pertence a ESTE projeto -- que nao tem dado nenhum -- e por
# construcao nao alcanca o projeto financeiro.
#
# ─── SEM PONTE ──────────────────────────────────────────────────────────────────────────────────
#
# Nada de FDW, nada de database link, nada de service_role compartilhado, nada de senha de banco
# compartilhada, nada de credencial de API de participante. Este projeto nao precisa de banco: a
# funcao fala com Redis (limites) e com o GitHub (Issue privada), e com mais nada.
#
# ─── project_id ─────────────────────────────────────────────────────────────────────────────────
#
# Deliberadamente um PLACEHOLDER: o projeto ainda nao existe e criar um projeto Supabase e ato do
# dono. `project_id` e identificador, nao credencial -- nenhum segredo mora neste arquivo, e nenhum
# deve morar. Ver o Human Gate da Issue #321.
project_id = "REPLACE_WITH_SUPPORT_PROJECT_REF"

[functions.user-report-intake]
# Reportar um bug nao pode exigir conta: exigir JWT transformaria "achei um bug" em "crie uma
# conta". O controle de abuso e limite de taxa pseudonimo, nao identidade.
verify_jwt = false
