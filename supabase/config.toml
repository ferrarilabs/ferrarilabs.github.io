# Projeto Supabase do Ferrari Labs. Só a configuração da Edge Function do gateway de dados ao
# vivo — nada de banco, auth ou storage é gerenciado a partir daqui.
project_id = "cmhqkkfczotdnssupkni"

[functions.live-football]
# Dado esportivo PÚBLICO: sem JWT. Exigir token obrigaria o navegador a portar credencial para
# ler placar, o que seria pior em segurança, não melhor.
verify_jwt = false

[functions.live-cache-ingest]
# Autenticada por token PROPRIO (LIVE_INGEST_TOKEN, comparacao em tempo constante), nao por JWT do
# Supabase: o relay de egresso nao e usuario do projeto. Sem o segredo a funcao responde 503.
verify_jwt = false

# `user-report-intake` NAO mora mais aqui -- ver `support-intake/supabase/`. Este projeto guarda os
# dados de participante, pagamento, scoring e ranking, e um endpoint publico NAO AUTENTICADO nao
# pode compartilhar runtime com eles: o Supabase injeta SUPABASE_DB_URL, SUPABASE_SECRET_KEYS e o
# legado SUPABASE_SERVICE_ROLE_KEY (que ignora RLS) em TODA Edge Function hospedada do projeto.
#
# A catraca `scripts/report/test_report_isolation.mjs` reprova se ele voltar para ca.
