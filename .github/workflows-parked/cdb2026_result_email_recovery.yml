# Recuperação de UMA notificação de resultado perdida — alvo EXPLÍCITO (#347).
#
# Não é um remetente de uso geral e não substitui o `cdb2026_result_emails.yml`. Existe para um
# caso só: uma perna cujo resultado JÁ está gravado em produção e cuja notificação comprovadamente
# não saiu. Fase, confronto, perna e placar esperado são digitados por quem dispara — nada é
# inferido, nada tem default, e não há fallback para "a última perna".
#
# `preflight` é SOMENTE LEITURA e é o padrão. Ele não alcança o provedor de e-mail em hipótese
# alguma: `BOLAO_ALLOW_REAL_SEND` só é declarada no passo de envio, e sem ela o `send_email()` do
# remetente falha fechado. Isso não é disciplina de quem escreve o comando — é a estrutura do job.
name: CDB2026 — recuperar e-mail de resultado (alvo explícito)

on:
  workflow_dispatch:
    inputs:
      phase_id:
        description: "fase (ex.: quartas)"
        required: true
        type: string
      tie_id:
        description: "confronto (tieId exato)"
        required: true
        type: string
      leg:
        description: "perna"
        required: true
        type: choice
        options: [first, second]
      expect_result:
        description: "placar JÁ gravado, no formato golsCasa-golsFora (ex.: 1-1). Divergência recusa."
        required: true
        type: string
      missing_refs:
        description: "RECUPERAÇÃO PARCIAL (#400): entry refs NÃO entregues, separados por espaço
          (ex.: 'ref1 ref2 ref3'). Deixe vazio para recuperação TOTAL. Os refs saem do
          WOULD_SEND_REFS do preflight autoritativo — nunca de inferência. Exige confirm_not_delivered."
        required: false
        type: string
      confirm_not_delivered:
        description: "Afirmação de que evidência EXTERNA prova que os refs de missing_refs não
          receberam (ex.: 'gmail-sent 2026-09-03: 6/12 neste assunto'). Separado de missing_refs de
          propósito: um é o alvo, o outro é a justificativa."
        required: false
        type: string
      acao:
        description: "preflight (só leitura) ou send (envio real, exige o alvo em READY)"
        required: true
        default: preflight
        type: choice
        options: [preflight, send]

permissions:
  contents: read

# Mesmo grupo do remetente automático: uma recuperação nunca corre junto de um envio de resultado.
concurrency:
  group: cdb2026-result-emails
  cancel-in-progress: false

jobs:
  recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── SOMENTE LEITURA ──────────────────────────────────────────────────────────────────────
      # Sem `BOLAO_ALLOW_REAL_SEND`. O provedor é inalcançável a partir daqui, por construção.
      - name: Preflight (read-only)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Mesmo motivo do passo de envio: interpolar `${{ inputs... }}` DENTRO do `run:` injeta o
          # valor no texto do shell antes de ele rodar. Este passo é read-only quanto a e-mail, mas
          # carrega `SUPABASE_SERVICE_ROLE_KEY` no ambiente — injeção aqui é exfiltração da chave de
          # operador, não um preflight barulhento. Por env, o valor é dado, nunca código.
          PHASE_ID: ${{ inputs.phase_id }}
          TIE_ID: ${{ inputs.tie_id }}
          LEG: ${{ inputs.leg }}
          EXPECT_RESULT: ${{ inputs.expect_result }}
          MISSING_REFS: ${{ inputs.missing_refs }}
          CONFIRM_NOT_DELIVERED: ${{ inputs.confirm_not_delivered }}
        working-directory: bolao/cdb2026/scripts
        run: |
          set -euo pipefail
          # O preflight avalia O MESMO alvo que o envio avaliaria — incluindo a autorização
          # parcial. Sem isso ele julgava um alvo diferente do que seria enviado: com
          # `missing_refs` preenchido, decidia UNCERTAIN (correto para um alvo SEM autorização),
          # saía 3, e matava o job antes do passo de envio. O preflight tem de responder sobre o
          # alvo real, senão ele não é o preflight daquele envio.
          ARGS=(--phase "$PHASE_ID" --tie "$TIE_ID" --leg "$LEG" --expect "$EXPECT_RESULT")
          if [ -n "${MISSING_REFS//[[:space:]]/}" ]; then
            mapfile -t REFS < <(bash build_missing_ref_args.sh)
            [ "${#REFS[@]}" -gt 0 ] || { echo "nenhum ref valido apos validacao"; exit 2; }
            for r in "${REFS[@]}"; do ARGS+=(--missing-ref "$r"); done
            ARGS+=(--confirm-not-delivered "$CONFIRM_NOT_DELIVERED")
          fi
          python3 recover_result_email.py "${ARGS[@]}" --preflight

      # ── ENVIO REAL ───────────────────────────────────────────────────────────────────────────
      # Só roda com `acao: send` escolhido à mão. O script REFAZ o preflight e recusa se o alvo não
      # estiver em READY_FOR_EXPLICIT_RECOVERY — a decisão não é herdada do passo anterior, porque
      # entre um passo e outro o estado pode ter mudado.
      - name: Enviar (uma vez, alvo explícito)
        if: ${{ inputs.acao == 'send' }}
        env:
          BOLAO_ALLOW_REAL_SEND: "I UNDERSTAND"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Entrada do operador SEMPRE por env, nunca interpolada em `${{ }}` dentro do corpo do
          # script: essa interpolação injeta o valor no TEXTO do shell antes de ele rodar, e é o
          # vetor clássico de command injection em Actions. Por env, o valor é dado, não código.
          PHASE_ID: ${{ inputs.phase_id }}
          TIE_ID: ${{ inputs.tie_id }}
          LEG: ${{ inputs.leg }}
          EXPECT_RESULT: ${{ inputs.expect_result }}
          MISSING_REFS: ${{ inputs.missing_refs }}
          CONFIRM_NOT_DELIVERED: ${{ inputs.confirm_not_delivered }}
        working-directory: bolao/cdb2026/scripts
        run: |
          set -euo pipefail
          ARGS=(--phase "$PHASE_ID" --tie "$TIE_ID" --leg "$LEG" --expect "$EXPECT_RESULT")

          if [ -n "${MISSING_REFS//[[:space:]]/}" ]; then
            # Validação léxica isolada e testável (test_missing_refs_parsing.py). Um ref por linha;
            # `mapfile` monta o array sem word-splitting. Sem `eval`, sem reconstruir a linha de
            # comando por string.
            mapfile -t REFS < <(bash build_missing_ref_args.sh)
            [ "${#REFS[@]}" -gt 0 ] || { echo "nenhum ref valido apos validacao"; exit 2; }
            for r in "${REFS[@]}"; do ARGS+=(--missing-ref "$r"); done
            ARGS+=(--confirm-not-delivered "$CONFIRM_NOT_DELIVERED")
            echo "MODO = RECUPERACAO PARCIAL (${#REFS[@]} ref autorizado(s))"
          else
            echo "MODO = RECUPERACAO TOTAL"
          fi

          python3 recover_result_email.py "${ARGS[@]}" --send

      # O vigia decide sozinho, lendo o ledger. Nada aqui escreve estado de vigilância à mão: se a
      # entrega aconteceu, ele vira HEALTHY porque existe evidência — não porque alguém o silenciou.
      - name: Vigia (read-only, após o envio)
        if: ${{ inputs.acao == 'send' }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: bolao/cdb2026/scripts
        continue-on-error: true
        run: python3 detect_missed_result_emails.py
