name: Bolão — Emails Copa 2026 (auto + manual)

on:
  schedule:
    # Every 10 min, 16:00-23:50 UTC = 12:00 PM–7:50 PM EDT
    - cron: '*/10 16-23 * 6-7 *'
    # Every 10 min, 00:00-05:50 UTC = 8:00 PM–1:50 AM EDT
    - cron: '*/10 0-5 * 6-7 *'
  workflow_dispatch:
    inputs:
      match_id:
        description: "Número do jogo (ex: 89) — vazio = modo auto ESPN"
        required: false
        type: string
        default: ""
      goals_a:
        description: "Gols time A (só se match_id fornecido)"
        required: false
        type: string
        default: ""
      goals_b:
        description: "Gols time B (só se match_id fornecido)"
        required: false
        type: string
        default: ""
      advance_side:
        description: "Quem avança — A ou B (só se match_id fornecido)"
        required: false
        type: choice
        options: ["", "A", "B"]
        default: ""

# Queue rather than cancel — avoids double-sends if jobs overlap
concurrency:
  group: auto-results
  cancel-in-progress: false

permissions:
  contents: write  # needed for auto_reopen to commit config.js

jobs:
  check-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 1: Send emails (auto ESPN detection or manual override) ──────────
      - name: Send result emails
        working-directory: bolao/copa2026/scripts
        env:
          # AUD-02: autorizacao POSITIVA e explicita do envio real. O sender falha fechado sem
          # isto — teste, execucao local e qualquer job nao declarado nao alcancam o provedor.
          BOLAO_ALLOW_REAL_SEND: "I UNDERSTAND"
          # COPA-PY-WRITER: gravar resultado agora passa por copa_apply_operator_mutation, que e
          # service_role. Antes este passo regravava o DOCUMENTO INTEIRO com a chave anon publica
          # — segundo gravador da mesma linha, sem token de concorrencia, e sem enviar
          # `updated_at`, que e justamente a coluna que o navegador consulta para decidir quem e
          # mais novo. As LEITURAS continuam na chave anon: menor privilegio por caminho.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COPA_ACTOR: gha-${{ github.run_id }}
        run: |
          MID="${{ github.event.inputs.match_id }}"
          if [ -n "$MID" ]; then
            echo "Manual mode: updating M${MID}"
            python3 send_result_email.py \
              --update "$MID" \
                       "${{ github.event.inputs.goals_a }}" \
                       "${{ github.event.inputs.goals_b }}" \
                       "${{ github.event.inputs.advance_side }}"
            python3 send_result_email.py
          else
            echo "Auto mode: checking ESPN for new results"
            python3 send_result_email.py --auto
          fi

      # ── Step 2: Reopen site after R32 if M88 is done ─────────────────────────
      - name: Check if site needs to reopen after R32
        id: reopen
        env:
          # PRODMIG-Q38-READ: auto_reopen.py le o documento PRIVADO de `main` para saber se o M88
          # terminou. Antes usava a chave anon PUBLICA — a mesma que vai no navegador. Agora exige
          # a credencial privilegiada e falha fechado sem ela.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: bolao/copa2026/scripts
        run: |
          output=$(python3 auto_reopen.py 2>&1)
          echo "$output"
          last_line=$(echo "$output" | tail -n 1)
          echo "action=$last_line" >> "$GITHUB_OUTPUT"

      - name: Commit reopened config.js
        if: steps.reopen.outputs.action == 'PATCHED'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add bolao/copa2026/js/config.js
          git commit -m "auto: reopen site for R16 edit window after R32 complete (M88 done)"
          git push
