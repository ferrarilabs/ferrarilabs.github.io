name: Feature Request
description: Propose a new capability or improvement.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: dropdown
    id: competition
    attributes:
      label: Competition
      options:
        - Framework / shared (bolao/shared)
        - CDB2026 (Copa do Brasil)
        - BR2026 (Brasileirão)
        - Copa2026 (Copa do Mundo, archived)
        - Powerball
        - Main site (index.html)
        - Not competition-specific
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / opportunity
      description: What's missing or painful today.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should be true once this ships.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: User impact
      description: Who benefits, and how much.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks / dependencies
      description: Anything touching scoring, ranking, entries, payments, or cross-app propagation must be called out explicitly here — see CLAUDE.md.
    validations:
      required: false
