name: Powerball Results (auto fetch + email)

on:
  schedule:
    # Real Powerball draw days are Monday / Wednesday / Saturday at 22:59 ET.
    # BUG FOUND 2026-08-06: this schedule previously covered Tuesday+Saturday
    # only (no Monday, no Wednesday) — so it silently never fired after any
    # Monday or Wednesday drawing, including 2026-08-05 (a Wednesday). Fixed
    # to cover all three real draw nights.
    # Monday 22:00-06:00 UTC (18:00-02:00 EDT) + Tue 02:59 UTC is Mon 22:59 EDT
    - cron: '*/10 22-23 * * 1'  # Monday 22:00-23:50 UTC
    - cron: '*/10 0-6 * * 2'    # Tuesday 00:00-06:50 UTC (covers Mon 20:00-02:50 EDT)
    # Wednesday 22:00-06:00 UTC (18:00-02:00 EDT) + Thu 02:59 UTC is Wed 22:59 EDT
    - cron: '*/10 22-23 * * 3'  # Wednesday 22:00-23:50 UTC
    - cron: '*/10 0-6 * * 4'    # Thursday 00:00-06:50 UTC (covers Wed 20:00-02:50 EDT)
    # Saturday 22:00-06:00 UTC (18:00-02:00 EDT) + Sun 02:59 UTC is Sat 22:59 EDT
    - cron: '*/10 22-23 * * 6'  # Saturday 22:00-23:50 UTC
    - cron: '*/10 0-6 * * 0'    # Sunday 00:00-06:50 UTC (covers Sat 20:00-02:50 EDT)
    # ─── CATCH-UP DIARIO (P0, 2026-08-11) ────────────────────────────────────────────────────
    #
    # BUG QUE ISTO FECHA: as janelas acima cobrem a NOITE do sorteio e terminam 06:50 UTC. Elas
    # assumem que o resultado oficial e publicado nessa janela. Em 2026-08-10 nao foi: o
    # data.ny.gov so publicou a linha do sorteio DEPOIS da ultima execucao agendada (07:11 UTC).
    #
    # A partir dai nao existia mais nenhuma execucao ate a proxima noite de sorteio -- entao o
    # resultado ficou disponivel e o e-mail simplesmente nunca saiu. E pior: cada execucao
    # daquela noite terminou VERDE, porque "resultado ainda nao publicado" e um estado normal que
    # sai com exit 0. Nenhum alarme, nenhuma falha, e 15 pessoas sem o e-mail.
    #
    # O modo de falha nao era a janela ser curta -- era nao existir NENHUMA revisita depois dela.
    # Quatro execucoes por dia fecham a lacuna sem virar polling agressivo: com o sorteio ja
    # notificado, cada uma custa uma consulta e sai em ALREADY_COMPLETED com providerCalls = 0.
    #
    # A seguranca nao depende desta cadencia. Depende dos portoes de identidade (o resultado tem
    # de ser DAQUELE sorteio), tempo (nada antes de 22:59 ET + carencia) e ledger (aceito nunca
    # reenvia). Executar mais vezes nao pode duplicar e-mail; executar de menos pode perde-lo.
    - cron: '0 8,12,16,20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (preview without sending email)"
        required: false
        type: boolean
        default: false
      force_resend:
        description: "Force resend even if already sent"
        required: false
        type: boolean
        default: false
      post_cutover:
        description: "Canario: exigir que anon esteja NEGADO no ledger (apos a migracao 021)"
        required: false
        type: boolean
        default: false

concurrency:
  group: powerball-results
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Configure git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      # PREFLIGHT DE DESTINATARIOS — roda ANTES, no unico ambiente que tem o segredo.
      #
      # Sem isto, a primeira vez que se descobre que falta contato de alguem e no meio do envio,
      # com o portao de completude bloqueando tudo corretamente mas tarde demais para corrigir
      # antes do sorteio. Imprime apenas CONTAGENS e nomes de exibicao -- nunca endereco, nunca
      # o conteudo do segredo.
      #
      # `continue-on-error`: um conjunto incompleto NAO deve derrubar o job, porque o passo
      # seguinte ja falha fechado sozinho. O valor aqui e o DIAGNOSTICO visivel no log.
      - name: Preflight de destinatarios (nao envia nada)
        working-directory: bolao/loterias/powerball/scripts
        continue-on-error: true
        env:
          POWERBALL_PRIVATE_PARTICIPANT_DATA: ${{ secrets.POWERBALL_PRIVATE_PARTICIPANT_DATA }}
          # Contatos ADITIVOS para quem entrou depois da ultima escrita do segredo principal. Um
          # segredo do GitHub so pode ser ESCRITO: acrescentar uma pessoa exigiria reescrever o
          # valor inteiro, e quem nao tem o conteudo atual apagaria todo mundo. Este e o caminho
          # seguro. O principal sempre vence em caso de conflito.
          POWERBALL_PRIVATE_CONTACTS_EXTRA: ${{ secrets.POWERBALL_PRIVATE_CONTACTS_EXTRA }}
        run: python3 recipient_preflight.py

      # CANARIO DO LEDGER — prova, de dentro do runner, que a credencial privilegiada
      # funciona. Nada disto e provavel da maquina de desenvolvimento: local existe um
      # `supabase link` que o runner nao tem, e nao existe a credencial que o runner tem. Foi
      # essa assimetria que deixou o ledger inoperante em producao com a suite verde localmente.
      #
      # Grava e apaga um job SINTETICO. Nunca toca notificacao real. Nunca imprime a credencial.
      - name: Canario do ledger (nao envia nada)
        working-directory: bolao/loterias/powerball/scripts
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # As RPCs do ledger executadas contra o Postgres REAL. So execucao revela erro de
          # tipo, cast que nao existe e enum que nao aceita texto -- foi assim que o N23 passou
          # despercebido por testes que liam o TEXTO do SQL. Roda aqui porque e aqui que a
          # credencial existe; na maquina de desenvolvimento este gate pula.
          python3 test_settle_rpc_real_db.py
          python3 ledger_canary.py ${{ inputs.post_cutover && '--post-cutover' || '' }}

      - name: Fetch and send results
        working-directory: bolao/loterias/powerball/scripts
        env:
          # Fallback participant emails, used only if the live Supabase read fails.
          # data.js is public and no longer carries email/txId (P0.1 hotfix) — this
          # secret is the only remaining source, injected as an env var, never written
          # to a file or committed.
          POWERBALL_PRIVATE_PARTICIPANT_DATA: ${{ secrets.POWERBALL_PRIVATE_PARTICIPANT_DATA }}
          # Mesmo suplemento do preflight -- os dois TEM de ver o mesmo conjunto. Preflight que
          # aprova o que o sender recusa (ou o contrario) e falso verde; ja aconteceu neste fluxo.
          POWERBALL_PRIVATE_CONTACTS_EXTRA: ${{ secrets.POWERBALL_PRIVATE_CONTACTS_EXTRA }}
          # N24: o ledger exige credencial privilegiada. A anon key e publica (vai em todo
          # config.js servido ao navegador) e, apos a migracao 021, nao tem mais execute nas
          # RPCs de notificacao. Sem esta variavel o ciclo falha FECHADO em vez de silenciosamente
          # nao gravar -- que era o modo de falha perigoso.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # ARMADO em 2026-08-10, apos o corte de seguranca do N24 e todos os portoes verdes:
          #   corte N24            anon revogado de TODAS as RPCs de notificacao (migracao 021)
          #   canario pos-corte    SERVICE_ROLE=PASS, ANON=DENIED, provado NO RUNNER
          #   matriz de crash A-M  20 testes, 2a execucao medida, 6/6 mutacoes capturadas
          #   preflight 08/10      15/15, MISSING=[]
          #   FULL VERIFY          101 gates
          #
          # DESARMAR = remover esta linha. Nada mais precisa mudar.
          #
          # O que ainda protege o envio, mesmo armado:
          #   identidade   o resultado tem de ser DAQUELE sorteio, nunca "o ultimo"
          #   tempo        nada antes de drawDateIso + 10 min de carencia
          #   ledger       claim atomico; aceito NUNCA e reenviado; parcial nunca vira concluido
          #   completude   conjunto incompleto de destinatarios bloqueia tudo
          #   credencial   sem SUPABASE_SERVICE_ROLE_KEY o ledger falha FECHADO
          # ARMADO em 2026-08-10, autorizado pelo Eduardo apos os 15 portoes verdes no SHA
          # atual, incluindo a prova que faltava: execucao AGENDADA real e verde no Actions
          # (run 31443702734), nao apenas dry-run.
          #
          # O que protege o envio, mesmo armado:
          #   identidade    o resultado tem de ser DAQUELE sorteio; nunca "o mais recente"
          #   tempo         nada antes de 22:59 ET + 10 min de carencia de publicacao
          #   ledger        claim atomico; aceito NUNCA reenvia; parcial nunca vira concluido
          #   transporte    alvo parcial RECUSA em vez de difundir; sem conjunto esperado, recusa
          #   completude    destinatario sem contato bloqueia o envio inteiro
          #   credencial    sem SUPABASE_SERVICE_ROLE_KEY o ledger falha FECHADO
          #   acao manual   o 08/08 esta marcado; o ciclo automatico nao o toca
          #
          # DESARMAR = remover esta linha. Nada mais precisa mudar.
          POWERBALL_EMAIL_MODE: production
        run: |
          DRY_RUN=""
          FORCE_RESEND=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY_RUN="--dry-run"
          [ "${{ github.event.inputs.force_resend }}" = "true" ] && FORCE_RESEND="--force-resend"
          python3 fetch_and_send_results.py $DRY_RUN $FORCE_RESEND
