# bolao_result_processing.yml — football-hardening readiness follow-up, item 8.
#
# NOT ACTIVE ON A SCHEDULE. workflow_dispatch only. This is a SAFE-MODE variant of the existing
# production crons (.github/workflows/auto_results.yml, cdb2026_result_emails.yml,
# br2026_round_emails.yml) — it exists for manual, reviewable, dry-run-by-default testing of the
# --dry-run flags added in this same pass (item 7), NOT as a replacement for those existing
# production workflows, which are untouched by this branch.
#
# Script:              bolao/{copa2026,cdb2026}/scripts/send_result_email.py --auto
#                       bolao/br2026/scripts/send_round_email.py --auto
# Backend repository:  Supabase (bolao_state table) — real production project. In dry_run=true
#                       mode (the default), the script's own DRY_RUN gate (item 7) means this
#                       workflow makes READ-ONLY Supabase calls and zero EmailJS calls.
# Secrets used:         none as GitHub Secrets (EmailJS/Supabase anon keys are hardcoded PUBLIC
#                       keys in each script, matching this repo's existing pattern — see
#                       CLAUDE.md, "Only anon key used")
# Concurrency:          one group per app, queued not cancelled — same as the existing production
#                       crons, avoids double-sends if two runs overlap
# Timeout:              20 minutes (dry-run should be fast; real mode inherits the per-recipient
#                       throttle cost documented in docs/bolao/FOOTBALL_HARDENING_SLO.md)
# Failure recovery:     each script's own audit_scoring.py self-test refuses to proceed on a
#                       scoring-logic mismatch; a failed run leaves Supabase state exactly as it
#                       was (no partial-write pattern in these scripts — see their own
#                       read-modify-write functions)

name: Bolão — Result Processing (dry-run capable)

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to process"
        required: true
        type: choice
        options: ["copa2026", "cdb2026", "br2026"]
      dry_run:
        description: "Dry run — no Supabase writes, no EmailJS sends (see item 7's DRY_RUN gate in each script)"
        required: false
        type: boolean
        default: true

concurrency:
  group: bolao-result-processing-${{ github.event.inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process-results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event.inputs.dry_run == 'true' && 'test' || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Run send script (--auto, dry-run per input)
        working-directory: bolao/${{ github.event.inputs.app }}/scripts
        run: |
          SCRIPT="send_result_email.py"
          if [ "${{ github.event.inputs.app }}" = "br2026" ]; then SCRIPT="send_round_email.py"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 "$SCRIPT" --auto --dry-run
          else
            python3 "$SCRIPT" --auto
          fi
