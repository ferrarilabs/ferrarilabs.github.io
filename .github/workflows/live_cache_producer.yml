# live_cache_producer.yml — Issue #246.
#
# POR QUE ESTE WORKFLOW EXISTE
# A Edge Function `live-football` nao alcanca mais a ESPN. O diagnostico autorizado (v13, removida
# depois) mediu, do proprio runtime: 403 nas TRES variantes de cabecalho testadas, com
# `server: AkamaiGHost` e pagina "Access Denied". Nao e User-Agent, nao e `accept`, nao e limite de
# taxa -- e a Akamai negando o EGRESSO do Supabase Edge Runtime. O MESMO endpoint responde 200 de
# um runner do GitHub Actions.
#
# Entao quem alcanca a fonte vira o produtor. O gateway continua o CONSUMIDOR, sem nenhuma mudanca:
# ele ja le `live_sports_cache`, ja valida forma antes de promover e ja sabe degradar. O teto de
# 10 minutos de ultimo-bom-conhecido (`LAST_KNOWN_GOOD_MAX_AGE_MS`) permanece INTOCADO -- a cadencia
# e que foi desenhada para caber dentro dele.
#
# CADENCIA, DERIVADA DE DADO E NAO DE PALPITE
# Histograma das 532 partidas com data nos snapshots commitados de br2026 + cdb2026, em UTC:
#     14h:7   18h:76  19h:54  20h:62  21h:59  22h:106  23h:84  00h:84
#     01h-13h: ZERO partidas
# Logo a janela real de atividade e 14h->02h UTC (ultimo kickoff 00h + ~3h de jogo).
#   · dentro da janela: a cada 5 min  -> idade maxima do cache ~5 min + duracao da execucao,
#     confortavelmente dentro do teto de 10 min do gateway.
#
# POR QUE NAO HA CADENCIA FORA DA JANELA (Issue #259, decidido em 2026-08-21)
# Existia um agendamento de 30 em 30 minutos nas horas 3-13 UTC, justificado como "cadencia baixa,
# so para manter o caminho vivo e visivel". Ele nao entregava NENHUMA das duas coisas:
#
#   1. FRESCOR -- impossivel por aritmetica. O gateway descarta ultimo-bom-conhecido com mais de
#      10 min (`LAST_KNOWN_GOOD_MAX_AGE_MS`). Uma cadencia de 30 min deixa o cache velho demais
#      por 20 de cada 30 minutos, MESMO quando a execucao grava com sucesso. Nao era um problema
#      de ajuste: 30 > 10 nunca cabe.
#   2. CAMINHO EXERCITADO -- nao acontece. `produceOne` retorna `SKIPPED_OUT_OF_WINDOW` ANTES de
#      qualquer chamada de rede e antes de tocar na credencial. Entre 03h e 13h UTC nao existe
#      NENHUMA partida no calendario commitado, entao a execucao so provava que o Node inicia e
#      que os arquivos de fixture fazem parse -- nem provedor, nem escrita, nem credencial.
#
# Fora da janela o cache envelhece e o gateway responde SOURCE_UNAVAILABLE. Isso e HONESTO e nao e
# regressao: nao existe jogo ao vivo as 08h UTC, e os apps caem no snapshot commitado, que renderiza
# a tabela e as 382 partidas do mesmo jeito. Se um dia se preferir zero 503, a mudanca certa NAO e
# ressuscitar este cron -- e ou subir a cadencia para <= 10 min (opcao B, 288 execucoes/dia contra um
# provedor que hoje bloqueia), ou afrouxar o teto do gateway (opcao D, que muda a semantica de
# "ultimo bom conhecido"). As duas precisam da sua propria decisao.
#
# ESCOPO
# Escreve em UMA tabela: `public.live_sports_cache` (dado esportivo publico; o COMMENT da propria
# tabela diz "Nunca contem dado de participante"). Nao toca `bolao_state`, participante, pagamento,
# scoring, ranking. NAO envia e-mail. NAO commita nada no repositorio.

name: Bolão — Produtor do cache ao vivo

on:
  schedule:
    # Janela de atividade derivada do calendario commitado (14h -> 02h UTC): 5 em 5 minutos.
    - cron: "*/5 14-23 * * *"
    - cron: "*/5 0-2 * * *"
    # NAO existe agendamento fora da janela. Ver "POR QUE NAO HA CADENCIA FORA DA JANELA" acima.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só simular (não grava no cache)"
        type: boolean
        default: true
      force:
        description: "Ignorar a janela derivada do calendário e buscar mesmo assim"
        type: boolean
        default: false

# Somente leitura do repositorio. Este workflow nao commita e nao abre PR.
permissions:
  contents: read

concurrency:
  # Duas execucoes simultaneas gravariam a mesma chave de upsert; a mais nova venceria de qualquer
  # forma, mas cancelar a antiga evita gastar rede a toa e torna o log legivel.
  group: live-cache-producer
  cancel-in-progress: true

jobs:
  produce:
    name: Produz observação e grava em live_sports_cache
    runs-on: ubuntu-latest
    # O ciclo dentro da execucao dura ~4m40s (ver produce_live_cache.mjs). 7 minutos cobrem isso
    # mais checkout/setup com folga, sem deixar um runner pendurado se algo travar.
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Produz o cache ao vivo
        env:
          # Escrita nesta tabela exige credencial privilegiada desde a migracao 011 (F8): a anon key
          # PUBLICA teve INSERT/UPDATE removidos depois que uma sonda provou que qualquer pessoa
          # podia sobrescrever o placar ao vivo de todo mundo. Sem fallback para anon -- o script
          # recusa gravar em vez de tentar com credencial proibida e falhar em silencio.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          # Execucao agendada sempre grava de verdade. Dispatch manual respeita as caixas, e o
          # padrao do dry_run e `true` -- o caminho seguro e o que acontece quando ninguem pensa.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
            [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          fi
          # Issue #381: uma execucao, MUITAS observacoes. O despacho continua de 5 em 5 minutos, mas
          # o runner fica vivo observando a cada 15s — gol aparece em ~15s em vez de ate 5 min.
          # Quem alcanca a ESPN e o runner do GitHub (Cloudflare e Supabase levam 403), entao a
          # frequencia tem de vir de DENTRO da execucao, nao de mais execucoes.
          #
          # O GATILHO NAO SERVE PARA DECIDIR ISSO. A primeira versao condicionava a
          # `github.event_name != workflow_dispatch`, e o ciclo nunca armou: desde o #369 quem
          # acorda este workflow e o cron da Cloudflare, e ele dispara pela API de
          # `workflow_dispatch`. A condicao excluia exatamente a execucao que precisa ciclar.
          #
          # O criterio certo e o PAPEL da execucao, nao quem a acordou: se ela esta GRAVANDO de
          # verdade, ela e responsavel por manter o placar fresco e cicla. Dry run e diagnostico
          # e continua single-shot.
          case "$ARGS" in
            *--dry-run*) : ;;
            *) ARGS="$ARGS --loop" ;;
          esac
          echo "node bolao/shared/scripts/produce_live_cache.mjs$ARGS"
          node bolao/shared/scripts/produce_live_cache.mjs $ARGS

  # 2026-11-01: o cron de 10 min do `cdb2026_result_emails.yml` foi acordado pelo GitHub ~4 vezes
  # por dia, e Gremio 2x0 Atletico-MG terminou sem nenhuma execucao (salvo e enviado a mao 1h30
  # depois). Este workflow e acordado de 5 em 5 minutos pela Cloudflare, entao ele vira o relogio
  # do e-mail de resultado. Este job NAO envia e-mail: le a projecao publica e, so se houver
  # perna SEM placar com kickoff entre 4h atras e 5 min a frente e nenhuma execucao do e-mail
  # ativa, dispara o `--auto`, que continua decidindo sozinho o que gravar e enviar.
  aciona-email-resultado-cdb2026:
    name: Aciona o e-mail de resultado do CDB2026 perto de jogo
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Decide e aciona
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DECISAO=$(python3 bolao/cdb2026/scripts/should_kick_result_emails.py)
          echo "$DECISAO"
          case "$DECISAO" in KICK*) ;; *) exit 0 ;; esac
          ATIVAS=$(gh run list -R "$GITHUB_REPOSITORY" --workflow cdb2026_result_emails.yml -L 20 \
            --json status -q '[.[] | select(.status != "completed")] | length')
          if [ "$ATIVAS" != "0" ]; then
            echo "Ja ha $ATIVAS execucao(oes) do e-mail de resultado ativa(s); nao aciono outra."
            exit 0
          fi
          gh workflow run cdb2026_result_emails.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "cdb2026_result_emails.yml acionado."

  # 2026-11-11: o `powerball-results-email.yml` foi acordado pelo GitHub 3 vezes na noite do Mega
  # Millions de 10/11 e o catch-up das 08:00 UTC nem disparou; o e-mail so saiu por reenvio manual
  # (no 06/11, 7h30 depois do sorteio). Mesma saida do CDB2026 acima. Este job NAO envia e-mail: le o
  # data.js e, so se houver sorteio com bilhetes SEM resultado entre 10 min e 24h depois do horario
  # oficial, nenhuma execucao do e-mail ativa e nenhuma criada nos ultimos 15 min, dispara o ciclo
  # normal (sem dry_run, sem force_resend), que continua decidindo sozinho o que gravar e enviar pelos
  # portoes de identidade, tempo e ledger. Os 15 min limitam a no maximo 4 execucoes por hora.
  aciona-email-resultado-loterias:
    name: Aciona o e-mail de resultado das loterias depois do sorteio
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Decide e aciona
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DECISAO=$(python3 bolao/loterias/powerball/scripts/should_kick_result_email.py)
          echo "$DECISAO"
          case "$DECISAO" in KICK*) ;; *) exit 0 ;; esac
          RECENTES=$(gh run list -R "$GITHUB_REPOSITORY" --workflow powerball-results-email.yml -L 20 \
            --json status,createdAt \
            -q "[.[] | select(.status != \"completed\" or (.createdAt | fromdateiso8601) > (now - 900))] | length")
          if [ "$RECENTES" != "0" ]; then
            echo "Ha $RECENTES execucao(oes) do e-mail ativa(s) ou criada(s) nos ultimos 15 min; nao aciono outra."
            exit 0
          fi
          gh workflow run powerball-results-email.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "powerball-results-email.yml acionado."

  # 2026-11-05: o cron de 10 min do `bolao_provider_snapshot.yml` foi acordado pelo GitHub 3 a 7
  # vezes por dia. A Tabela e os resultados encerrados do BR2026 e do CDB2026 ficavam horas atrasados,
  # e nada no site dizia isso. Mesma saida do e-mail de resultado acima: este workflow e acordado de
  # 5 em 5 minutos pela Cloudflare e vira o relogio do snapshot. Um app por vez, alternando pelo
  # bloco de 5 minutos, entao cada app volta a ser coletado a cada ~10 min, a cadencia que o cron
  # prometia. Nunca dispara com outra execucao do snapshot ativa: os dois apps publicam por PR na
  # mesma `main`, e a matriz do proprio snapshot ja e serial pelo mesmo motivo.
  aciona-snapshot:
    name: Aciona o snapshot da ESPN (br2026 e cdb2026, alternados)
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - name: Decide e aciona
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ATIVAS=$(gh run list -R "$GITHUB_REPOSITORY" --workflow bolao_provider_snapshot.yml -L 20 \
            --json status -q '[.[] | select(.status != "completed")] | length')
          if [ "$ATIVAS" != "0" ]; then
            echo "Ja ha $ATIVAS execucao(oes) do snapshot ativa(s); nao aciono outra."
            exit 0
          fi
          if [ $(( $(date +%s) / 300 % 2 )) -eq 0 ]; then APP=br2026; else APP=cdb2026; fi
          gh workflow run bolao_provider_snapshot.yml -R "$GITHUB_REPOSITORY" --ref main \
            -f app="$APP" -f dry_run=false
          echo "bolao_provider_snapshot.yml acionado para $APP."
