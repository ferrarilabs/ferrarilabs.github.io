name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    # Only deploy when actual site content changes — not scripts, docs, or
    # workflow files. This prevents queuing on every bot commit.
    paths:
      - 'bolao/index.html'
      - 'bolao/js/**'
      - 'bolao/css/**'
      - 'bolao/assets/**'
      - 'index*.html'
      - 'styles.css'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel any in-progress deploy when a newer commit arrives — always ship latest
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
