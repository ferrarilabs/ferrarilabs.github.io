name: M8/M9 — probe de alcance (diagnóstico)

# Roda sob demanda. Mede o que a producao permite para audit_events/outbox_events e prova que a
# anon esta negada. Nao envia e-mail, nao muta estado de negocio: a unica escrita e um evento de
# probe imediatamente removido.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Probe de alcance
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 bolao/scripts/audit_outbox_probe.py
      - name: Matriz de queda e forja
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 bolao/scripts/test_m8m9_integration.py
      - name: Canario de acesso seguro do CDB
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 bolao/cdb2026/scripts/secure_access_canary.py
      - name: Credenciais de acesso do CDB (vivas x revogadas)
        # `always()`: esta e a medida que diz se os convites entregues AUTENTICAM. Se um passo
        # anterior falhar, e exatamente quando mais se precisa dela.
        if: always()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 bolao/cdb2026/scripts/check_access_credentials.py
