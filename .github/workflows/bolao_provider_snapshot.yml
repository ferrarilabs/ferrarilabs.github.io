# bolao_provider_snapshot.yml — refresh do snapshot normalizado da ESPN.
#
# ─── 2026-08-08: O PASSO ADIADO FOI FEITO (schedule + commit-back) ───────────────────────────
#
# Este arquivo dizia, no próprio cabeçalho: "NOT ACTIVE ON A SCHEDULE... Enabling a real
# `schedule:` trigger is a deliberate, separate, reviewed step". Esse passo nunca aconteceu.
#
# Enquanto isso, a migração da ESPN (37ab46a) passou os TRÊS apps a LEREM este snapshot em vez de
# chamarem a ESPN do navegador. Ou seja: a única fonte de dado de jogo dos apps virou um arquivo
# que nada atualizava. Medido em 2026-08-08: `bolao/br2026/data/espn-normalized.json` tinha UM
# único commit em toda a história — o da própria migração. Congelado desde então.
#
# EFEITO PARA O USUÁRIO, relatado pelo Eduardo com um jogo acontecendo ao vivo: `_liveMatches`
# nunca era preenchido, então o hero de jogo ao vivo NUNCA aparecia em nenhum dos apps, as barras
# de probabilidade ao vivo ficavam sem dado, e os crons de email de resultado liam um snapshot
# permanentemente velho.
#
# É a mesma classe de falha que esta sprint inteira perseguiu: o workflow rodava, imprimia
# `wrote=True reason=refreshed` e terminava VERDE — mas escrevia num runner efêmero, sem
# `contents: write` e sem passo de commit. Número honesto sobre um efeito que havia sumido.
#
# ─── Desenho ────────────────────────────────────────────────────────────────────────────────
#
# Script:        bolao/{br2026,cdb2026}/scripts/sync_espn.py
# Backend:       nenhum — leitura pública da ESPN + escrita de JSON local. Sem Supabase, sem
#                credencial, sem dado de participante em lugar nenhum deste caminho.
# Cadência:      */10 nas janelas de jogo, a MESMA dos crons de email de resultado já existentes
#                (cdb2026_result_emails.yml), que é exatamente o que o cabeçalho original previa.
# Commit:        só quando o arquivo MUDA. Fora de janela o snapshot vem idêntico
#                (`wrote=False reason=unchanged`) e um commit vazio a cada 10 min seria ruído no
#                histórico e um deploy inútil.
# Copa2026:      DELIBERADAMENTE FORA do schedule. O torneio terminou e o app está arquivado
#                (CONFIG.archived) — atualizar o snapshot dele não teria efeito nenhum e só
#                geraria churn. Continua disponível por workflow_dispatch, para o caso de alguém
#                precisar reprocessar algo histórico.
# Concorrência:  um grupo por app, enfileirado e não cancelado — duas atualizações do MESMO app
#                nunca podem correr contra a escrita atômica uma da outra.
# Falha:         `build_snapshot()` do espn_provider.py preserva o último snapshot bom, então um
#                fetch que falha nunca corrompe o arquivo; a próxima execução tenta de novo.

name: Bolão — Provider Snapshot (dry-run capable)

on:
  schedule:
    # ─── 2026-08-09: JANELA REMOVIDA. Roda o dia inteiro. ────────────────────────────────────
    #
    # Estas duas linhas eram `*/10 16-23` e `*/10 0-5` (UTC) — copiadas dos crons de email, que
    # foram desenhados para rodada NOTURNA. O efeito: entre 06:00 e 16:00 UTC nada rodava.
    #
    # Em 2026-08-09, domingo, Cruzeiro×Mirassol começou às 14:00 UTC (10:00 EDT / 11:00 BRT) —
    # exatamente dentro do ponto cego. O snapshot ficou 468 minutos velho, continuou dizendo
    # `state: "pre"` com o jogo rolando, e o hero de jogo ao vivo sumiu da tela do Eduardo. Foi a
    # SEGUNDA vez que ele relata o mesmo sintoma, com causa diferente da primeira (a primeira era
    # o workflow não commitar; esta é o workflow nem acordar).
    #
    # A correção não é mover a janela para caber o jogo de hoje — seria a terceira vez errando o
    # mesmo alvo, porque a próxima tabela vai ter um horário que a janela nova também não cobre.
    # A janela é uma otimização que só faz sentido se a economia valer o risco, e aqui não vale:
    # o passo commita SOMENTE quando o conteúdo muda (`wrote=False reason=unchanged` fora de
    # jogo), então rodar 24h não gera commit, nem deploy, nem ruído — só algumas execuções de
    # ~13s a mais num repositório público, onde Actions não é cobrado.
    #
    # O gate que impede a regressão de voltar por outro caminho:
    # `bolao/scripts/audit_snapshot_window_coverage.mjs` lê os jogos REAIS do snapshot e falha se
    # existir partida cuja janela ao vivo não seja coberta por este cron.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      app:
        description: "Which app's snapshot to refresh"
        required: true
        type: choice
        options: ["copa2026", "br2026", "cdb2026"]
      dry_run:
        description: "Dry run — fetch and validate, but do NOT commit the snapshot back to the repo"
        required: false
        type: boolean
        default: true

concurrency:
  # `github.event.inputs.app` é vazio numa execução agendada; o sufixo do app entra no nome do JOB
  # (matriz) e o grupo aqui separa agendado de manual para não se cancelarem.
  group: bolao-provider-snapshot-${{ github.event.inputs.app || 'scheduled' }}
  cancel-in-progress: false

permissions:
  # Era `contents: read` — e é por isso que nem o dispatch manual conseguia persistir coisa
  # alguma: o workflow terminava verde tendo escrito só no disco do runner.
  contents: write
  # Um push feito com o GITHUB_TOKEN NUNCA dispara outro workflow (proteção anti-loop do GitHub),
  # então o deploy do Pages tem de ser PEDIDO explicitamente. Mesma lição já registrada e resolvida
  # em sync_version.yml. Sem isto o snapshot novo chega à main mas não ao ar — meio caminho para o
  # mesmo bug.
  actions: write

jobs:
  refresh-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Numa execução agendada roda os dois apps ativos; num dispatch manual roda só o escolhido.
      fail-fast: false
      matrix:
        app: ${{ github.event_name == 'schedule' && fromJSON('["br2026","cdb2026"]') || fromJSON('[""]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve app / dry-run
        id: cfg
        run: |
          APP="${{ matrix.app || github.event.inputs.app }}"
          # Execução agendada não tem inputs: commita de verdade. Dispatch manual respeita a caixa.
          if [ "${{ github.event_name }}" = "schedule" ]; then DRY="false"; else DRY="${{ github.event.inputs.dry_run }}"; fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          echo "Refreshing '$APP' (dry_run=$DRY)"

      - name: Run sync_espn.py
        working-directory: bolao/${{ steps.cfg.outputs.app }}/scripts
        run: python3 sync_espn.py

      - name: Report (dry-run — snapshot NOT committed)
        if: steps.cfg.outputs.dry == 'true'
        run: |
          echo "Dry run: o snapshot foi escrito localmente por sync_espn.py, mas este workflow"
          echo "NÃO vai commitar/publicar (o passo de commit abaixo não roda em dry-run)."
          cat "bolao/${{ steps.cfg.outputs.app }}/data/espn-normalized.json"

      - name: Commit refreshed snapshot
        id: commit
        if: steps.cfg.outputs.dry != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "bolao/${{ steps.cfg.outputs.app }}/data/"
          if git diff --cached --quiet; then
            echo "Snapshot inalterado — nada a commitar."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            # NUNCA escrever o marcador literal de skip-ci nesta mensagem: o GitHub varre a
            # mensagem inteira e pularia os workflows deste próprio commit (lição já registrada).
            git commit -m "chore(espn): refresh ${{ steps.cfg.outputs.app }} snapshot"
            # Outra execução pode ter commitado no intervalo; rebase antes de empurrar.
            git pull --rebase --autostash origin main
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy for the refreshed snapshot
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Deploy GitHub Pages" --ref main
          echo "Deploy GitHub Pages dispatched for the refreshed snapshot."
