name: Powerball — Abrir sorteio no banco (operador)

# Cria no banco (sistema de registro desde 2026-08-22) o sorteio, as participacoes e as
# contribuicoes descritas num manifesto VERSIONADO em bolao/loterias/powerball/operations/.
# Sem `apply` e simulacao: le o banco, resolve tudo e mostra o plano, sem gravar.
#
# Em seguida regenera `data/public_projection.generated.json` a partir do banco e o publica como
# artifact da execucao. NAO commita nada: o artifact entra no PR que atualiza `data.js`, e o
# `--check` do CI confere os dois.
#
# Com `apply`, o job `site` leva o resultado ao site sem PR feito a mao: deriva do banco os
# participantes do sorteio no `data.js` (sync_draw_participants.mjs), publica por PR rolante
# (scripts/ci/publish_data_via_pr.sh), espera o `npm run check` exigido, faz o merge e dispara o
# deploy. O merge feito pelo GITHUB_TOKEN nao acorda o `push` do deploy-pages (anti-loop do
# GitHub), por isso o deploy e disparado explicitamente.
#
# Nenhum dado de pagamento entra como input: o repositorio e publico e o GitHub imprime no log os
# valores de `inputs`. O unico input e o CAMINHO do manifesto, que ja foi revisado em PR.

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Manifesto (ex.: bolao/loterias/powerball/operations/2026-10-28.json)"
        type: string
        required: true
      apply:
        description: "Gravar de verdade (sem isto e simulacao)"
        type: boolean
        default: false

permissions:
  contents: read

# Mesmo grupo do registro de pagamento: as duas escrevem no razao e nao podem correr juntas.
concurrency:
  group: powerball-operator-payment
  cancel-in-progress: false

jobs:
  abrir:
    name: Abrir sorteio (server-side)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Manifesto dentro da pasta de operacoes
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          case "$MANIFEST" in
            bolao/loterias/powerball/operations/*.json) ;;
            *) echo "::error::manifesto fora de bolao/loterias/powerball/operations/"; exit 1 ;;
          esac
          case "$MANIFEST" in *..*) echo "::error::caminho com '..'"; exit 1 ;; esac
          test -f "$MANIFEST"

      - name: Abrir sorteio
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_ACTOR: ${{ github.actor }}
          MANIFEST: ${{ inputs.manifest }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          ARGS=(--manifest "$GITHUB_WORKSPACE/$MANIFEST")
          [ "$APPLY" = "true" ] && ARGS+=(--apply)
          python3 bolao/loterias/powerball/scripts/operator_open_draw.py "${ARGS[@]}"

      - name: Regenerar a projecao publica a partir do banco
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node bolao/loterias/powerball/scripts/generate_public_projection.mjs --write

      - uses: actions/upload-artifact@v4
        with:
          name: public-projection
          path: bolao/loterias/powerball/data/public_projection.generated.json
          retention-days: 14

  site:
    name: Publicar no site (PR automatico)
    needs: abrir
    if: inputs.apply
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Derivar participantes, projecao e pin do banco
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          DRAW="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).draw_date)' "$MANIFEST")"
          echo "DRAW=$DRAW" >> "$GITHUB_ENV"
          node bolao/loterias/powerball/scripts/generate_public_projection.mjs --write
          node bolao/loterias/powerball/scripts/sync_draw_participants.mjs --draw "$DRAW"
          node bolao/loterias/powerball/scripts/generate_public_projection.mjs --check

      - name: Publicar via PR, esperar o check e fazer o merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          FILES=(bolao/loterias/powerball/js/data.js
                 bolao/loterias/powerball/data/public_projection.generated.json
                 bolao/shared/safety/powerball_public_projection_pin.json
                 "$MANIFEST")
          git fetch --quiet origin main
          if git diff --quiet origin/main -- "${FILES[@]}"; then
            echo "Site ja reflete o banco — nada a publicar."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit --quiet -m "Powerball: participantes do sorteio de $DRAW a partir do banco (automatico)"
          BRANCH="auto/data/powerball-$DRAW"
          scripts/ci/publish_data_via_pr.sh "$BRANCH" \
            "Powerball: participantes do sorteio de $DRAW (automatico)" \
            "Participantes, projecao e pin do sorteio de $DRAW derivados do banco por powerball_open_draw.yml depois do apply. Merge automatico com \`npm run check\` verde." \
            "${FILES[@]}"
          PR="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')"
          SHA="$(git rev-parse HEAD)"
          # O check foi disparado por workflow_dispatch no topo do branch; espera o run DESTE commit.
          RUN=""
          for _ in $(seq 1 30); do
            RUN="$(gh run list --workflow safety_check.yml --branch "$BRANCH" --json databaseId,headSha \
                   --jq "map(select(.headSha == \"$SHA\"))[0].databaseId // empty")"
            [ -n "$RUN" ] && break
            sleep 10
          done
          [ -n "$RUN" ] || { echo "::error::npm run check nao apareceu para $SHA"; exit 1; }
          gh run watch "$RUN" --exit-status --interval 30 >/dev/null
          # Mensagem explicita: o squash padrao acrescentaria Co-authored-by com e-mail real,
          # que o commit-message-pii-gate reprova no main.
          gh pr merge "$PR" --squash --delete-branch \
            --subject "Powerball: participantes do sorteio de $DRAW (automatico) (#$PR)" \
            --body "Participantes, projecao e pin derivados do banco por powerball_open_draw.yml."
          gh workflow run deploy-pages.yml --ref main
          echo "PR #$PR mergeado e deploy disparado."
