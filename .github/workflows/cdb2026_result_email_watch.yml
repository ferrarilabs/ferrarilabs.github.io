# cdb2026_result_email_watch.yml — Issue #180.
#
# POR QUE ESTE WORKFLOW EXISTE
# `send_result_email.py --auto` sai com 0 tanto quando nao havia nada a fazer quanto quando havia um
# resultado e o envio se perdeu. No painel do Actions os dois casos sao o mesmo verde. Foi assim que
# o HIST-037 (2026-08-06) passou: duas partidas terminadas ficaram sem notificacao por 3 a 27 horas,
# e quem percebeu foi o dono, nao o monitoramento.
#
# Este vigia le o ledger duravel (`bolao_notif_jobs`, pool `cdb2026`) e responde a pergunta que o
# verde nao responde: terminou uma perna e o e-mail NAO saiu?
#
# ESTE WORKFLOW NAO ENVIA E-MAIL. NUNCA.
# O sinal e o PROPRIO RESULTADO da execucao -- GitHub-native, como a autorizacao da #180 determina.
# Nao ha destinatario, nao ha template, nao ha transporte. O `detect_missed_result_emails.py` e
# testado (caso 8) contra a presenca de qualquer simbolo de envio.
#
# CODIGOS DE SAIDA, E POR QUE SAO TRES E NAO DOIS
#   0  HEALTHY / PRE_LEDGER  -> nada a fazer
#   2  GAP                   -> uma perna terminou sem entrega registrada
#   3  UNKNOWN               -> o ledger ou o estado nao pode ser LIDO
#
# UNKNOWN e GAP falham os dois, mas com codigos DIFERENTES e mensagens diferentes, e essa distincao
# e a razao de o detector existir. Um monitor que nao separa "nao ha registro" de "nao consegui ler"
# vira gerador de alarme falso durante exatamente a queda que importa -- e um alarme que grita em
# toda queda e silenciado, e ai o defeito real volta a passar despercebido.
#
# ─── POR QUE O SINAL PASSOU A SER UMA TRANSICAO, E NAO O CODIGO CRU (Issue #373) ─────────────────
#
# O detector esta certo. O SINAL e que estava errado. Traduzir qualquer GAP em `exit 1` fazia UMA
# lacuna persistente e ja conhecida (`quartas:espn-atletico-mg_cruzeiro:first`, run 33207263422)
# reprovar TODA execucao agendada, duas vezes por dia, com e-mail de falha do GitHub a cada vez --
# mesmo sem NADA ter mudado. Isso e o alarme cronico descrito tres paragrafos acima, produzido pelo
# proprio workflow que existe para evita-lo.
#
# A lacuna agora vira um INCIDENTE com identidade estavel (fingerprint do `findingId`), guardado no
# mesmo state store que o monitor Sentinel ja usa -- a Issue e seu bloco de estado embutido
# (scripts/sentinel/github_state.mjs). Nenhum segundo state store foi inventado.
#
#   HEALTHY -> GAP_DETECTED -> GAP_STILL_OPEN -> RECOVERED
#
#   GAP_DETECTED    lacuna nova, OU a mesma lacuna com evidencia ALTERADA. Abre/atualiza UMA Issue
#                   e reprova a run (exit 1).
#   GAP_STILL_OPEN  mesma lacuna, evidencia identica. O incidente CONTINUA sendo atualizado
#                   (occurrence_count, last_seen_at) -- o que e deduplicado e a NOTIFICACAO, nunca
#                   a deteccao. Run verde e silenciosa.
#   RECOVERED       so por confirmacao POSITIVA (o detector leu o ledger e afirmou o pool limpo).
#                   Ausencia do relatorio nunca fecha incidente. Fecha a Issue, run verde.
#   UNKNOWN         SEMPRE reprova, nunca e deduplicado, nunca abre incidente de lacuna. "Nao
#                   consegui ler" nao pode virar "esta tudo bem" nem ser silenciado por dedupe.
#
# ESTA CAMADA TAMBEM NAO ENVIA E-MAIL, nao escreve no ledger e nao roda o detector de novo: ela le o
# JSON ja produzido e escreve apenas Issues. Provado por scripts/sentinel/test_result_email_gap_detector.mjs
# (55 asserts, incluindo o controle de mutacao que mata uma dedupe que pararia de acusar lacuna nova).

name: Bolão CDB2026 — Vigia do e-mail de resultado

on:
  schedule:
    # Duas vezes por dia, bem depois das janelas de envio (que rodam 16-23 e 0-5 UTC). A folga de
    # 3h do proprio detector ja evita acusar perna recente; esta cadencia so precisa ser regular.
    - cron: "17 8 * * *"
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # o incidente É o state store: sem isto a transicao nao tem onde ser lembrada

concurrency:
  group: cdb2026-result-email-watch
  cancel-in-progress: true

jobs:
  watch:
    name: Detecta e-mail de resultado perdido (somente leitura)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Detecta lacunas (somente leitura)
        id: detect
        env:
          # Leitura do ledger e do estado exige a credencial privilegiada; a anon key nao alcanca
          # `bolao_notif_jobs`. A variavel que ARMA envio real (`BOLAO_ALLOW_REAL_SEND`) NAO e
          # definida aqui, de proposito: mesmo que alguem importe o sender por engano, o envio
          # continua desarmado.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          python3 bolao/cdb2026/scripts/detect_missed_result_emails.py --json > "$RUNNER_TEMP/report.json"
          CODE=$?
          set -e
          echo "detector exit=$CODE"
          # O codigo cru NAO decide mais a cor da run -- a transicao decide (ver cabecalho). Ele
          # segue impresso porque continua sendo a saida honesta do detector.
          cat "$RUNNER_TEMP/report.json"

      - name: Classifica a transicao e mantem o incidente
        env:
          GH_TOKEN: ${{ secrets.SENTINEL_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/sentinel/result_email_gap_watch.mjs --report "$RUNNER_TEMP/report.json"
