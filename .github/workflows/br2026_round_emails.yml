name: Bolão BR2026 — Emails de rodada (auto)

on:
  schedule:
    # Every 30 min, 21:00-23:50 UTC = 6:00 PM-8:50 PM EDT (typical BR2026 evening kickoffs)
    - cron: '*/30 21-23 * * *'
    # Every 30 min, 00:00-04:50 UTC = 8:00 PM-12:50 AM EDT (covers late kickoffs + completion)
    - cron: '*/30 0-4 * * *'
  workflow_dispatch: {}

# Queue rather than cancel — avoids double-sends if jobs overlap
concurrency:
  group: br2026-round-emails
  cancel-in-progress: false

jobs:
  check-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # DESARMADO EMERGENCIALMENTE em 2026-08-18 ~22:14 UTC -- NOVO INCIDENTE, distinto do #221.
      #
      # Evidencia (Gmail Sent): por volta de 2026-08-18 17:25 EDT, um lote completo saiu para os
      # 11 participantes reais com assunto "Rodada 08.08-09.08" -- uma rodada ANTIGA, ja concluida
      # ha muito tempo, nao a rodada corrente ("Rodada 15.08-17.08", que ja tinha sido enviada as
      # 00:57 EDT do mesmo dia). Isto e um incidente NOVO -- nao o #221 se repetindo -- e a causa
      # raiz ainda esta sob investigacao (hipotese principal: o ledger duravel novo, criado durante
      # a remediacao do #221, so foi retroativamente preenchido (backfill) para a rodada 23 --
      # qualquer OUTRA rodada historica sem linha no ledger pode estar sendo interpretada como
      # "nunca enviada" e reenviada).
      #
      # Desarmado no meio da janela de cron ativa (21-23 UTC) para impedir uma proxima execucao
      # (proxima em ate 30 min) de reenviar qualquer outra rodada historica antes da causa raiz
      # ser entendida e corrigida.
      #
      # REARMAR = so depois de: (1) causa raiz confirmada, (2) toda rodada historica completada
      # comprovadamente NAO elegivel para reenvio (HISTORICAL_ROUND_RESURRECTION = IMPOSSIVEL,
      # nao so a rodada especifica deste incidente backfilled), (3) verificado contra producao.
      - name: Reconciliar rodadas (dry-run -- envio real DESARMADO, novo incidente 2026-08-18)
        working-directory: bolao/br2026/scripts
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOLAO_ALLOW_REAL_SEND: "DISARMED_NEW_INCIDENT_20260818"
        run: python3 send_round_email.py --dry-run
