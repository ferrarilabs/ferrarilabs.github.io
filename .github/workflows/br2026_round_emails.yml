name: Bolão BR2026 — Emails de rodada (auto)

on:
  schedule:
    # Every 30 min, 21:00-23:50 UTC = 6:00 PM-8:50 PM EDT (typical BR2026 evening kickoffs)
    - cron: '*/30 21-23 * * *'
    # Every 30 min, 00:00-04:50 UTC = 8:00 PM-12:50 AM EDT (covers late kickoffs + completion)
    - cron: '*/30 0-4 * * *'
  workflow_dispatch: {}

# Queue rather than cancel — avoids double-sends if jobs overlap
concurrency:
  group: br2026-round-emails
  cancel-in-progress: false

jobs:
  check-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # DRY-RUN ate autorizacao explicita do Eduardo.
      #
      # O caminho de reconciliacao e o CANONICO e o MESMO que envia: manifesto versionado ->
      # resolver por rodada -> ledger duravel -> portao de destinatarios. O que o --dry-run faz e
      # parar antes da primeira chamada ao provedor. Nao e um caminho paralelo; um preview que
      # roda por outro caminho nao prova nada sobre o caminho que envia.
      #
      # BOLAO_ALLOW_REAL_SEND foi REMOVIDO deste job de proposito. Com a variavel ausente, o
      # portao fail-closed do sender bloqueia o provedor mesmo que alguem troque a flag por
      # engano -- duas travas independentes, nao uma.
      #
      # Para religar o envio real: (1) autorizacao explicita do Eduardo, (2) migracao
      # 010_notification_durability.sql aplicada, (3) trocar --dry-run por --auto e devolver
      # BOLAO_ALLOW_REAL_SEND.
      - name: Reconciliar rodadas (dry-run — nenhum e-mail e enviado)
        working-directory: bolao/br2026/scripts
        run: python3 send_round_email.py --dry-run
