name: Bolão BR2026 — Emails de rodada (auto)

on:
  schedule:
    # Every 30 min, 21:00-23:50 UTC = 6:00 PM-8:50 PM EDT (typical BR2026 evening kickoffs)
    - cron: '*/30 21-23 * * *'
    # Every 30 min, 00:00-04:50 UTC = 8:00 PM-12:50 AM EDT (covers late kickoffs + completion)
    - cron: '*/30 0-4 * * *'
  workflow_dispatch: {}

# Queue rather than cancel — avoids double-sends if jobs overlap
concurrency:
  group: br2026-round-emails
  cancel-in-progress: false

jobs:
  check-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # DESARMADO em 2026-08-18 (Issue #221) -- INCIDENTE CONFIRMADO, nao suspeita.
      #
      # A rodada 23 foi enviada 4x para os 11 participantes reais (44 envios em vez de 11),
      # em quatro execucoes agendadas independentes entre 2026-08-17 22:45 ET e 2026-08-18
      # 00:57 ET. Todas as quatro reivindicaram a MESMA idempotencyKey
      # (br2026:round-results:23:v1) e a listagem de reconciliacao continuou mostrando
      # `R23 ROUND_READY_TO_NOTIFY` mesmo apos execucoes anteriores ja terem enviado.
      #
      # Causa raiz: `SupabaseStateRoundLedgerRepo` (em send_round_email.py) alega durabilidade
      # na propria docstring, mas `put()` so muta um dict em memoria construido de um GET
      # `sb_fetch()` -- nao existe NENHUMA chamada PUT/PATCH/upsert no arquivo que grave
      # `bolao_state.roundEmail.ledger` de volta no Supabase. Cada execucao agendada parte do
      # mesmo documento obsoleto, ve a rodada como nao reivindicada e reenvia. Isto reproduz
      # em QUALQUER rodada futura, nao e especifico da R23.
      #
      # Corrigir isto exige religar o claim/settle da rodada a um armazenamento que realmente
      # persiste (provavelmente o ledger atomico via RPC ja usado por outras familias de
      # notificacao) -- projeto ainda nao autorizado/implementado. Ate la, ARMAR = trocar
      # --dry-run por --auto e o valor de BOLAO_ALLOW_REAL_SEND para "I UNDERSTAND" (branch
      # fix/br2026-round-email-duplication-221 / commit anterior a este).
      #
      # BOLAO_ALLOW_REAL_SEND permanece PRESENTE de proposito (nao removido): o portao de
      # transporte de send_round_email.py exige o nome exato desta variavel para o cron nao
      # falhar fechado em silencio (ver scripts/safety/audit_safety_contract.mjs, secao 3). O
      # valor abaixo NAO e o token magico "I UNDERSTAND" e o modo e --dry-run: as duas travas
      # concordam em "desarmado", em vez de divergir em silencio.
      - name: Reconciliar rodadas (dry-run -- envio real DESARMADO, ver Issue #221)
        working-directory: bolao/br2026/scripts
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOLAO_ALLOW_REAL_SEND: "DISARMED_INCIDENT_221_SEE_ISSUE"
        run: python3 send_round_email.py --dry-run
