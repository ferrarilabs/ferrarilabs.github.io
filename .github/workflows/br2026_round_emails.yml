name: Bolão BR2026 — Emails de rodada (auto)

on:
  schedule:
    # Every 30 min, 21:00-23:50 UTC = 6:00 PM-8:50 PM EDT (typical BR2026 evening kickoffs)
    - cron: '*/30 21-23 * * *'
    # Every 30 min, 00:00-04:50 UTC = 8:00 PM-12:50 AM EDT (covers late kickoffs + completion)
    - cron: '*/30 0-4 * * *'
  workflow_dispatch: {}

# Queue rather than cancel — avoids double-sends if jobs overlap
concurrency:
  group: br2026-round-emails
  cancel-in-progress: false

jobs:
  check-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # REARMADO em 2026-08-19 (Issue #238). O incidente (rodada 22, ja concluida e notificada
      # de verdade em 2026-08-11, reenviada aos 11 participantes reais na primeira execucao apos
      # o rearme do #221) tinha causa raiz na migracao do #221: a troca para `AtomicRoundLedgerRepo`
      # so foi retroativamente povoada para a rodada 23 (a rodada do #221) -- a UNICA evidencia de
      # entrega da rodada 22 ficou presa no JSON antigo `bolao_state.roundEmail.ledger`, que nada
      # mais lia. Corrigido pelo PR #242: `notification_states_from_legacy_round_ledger_json()`
      # volta a ler o JSON antigo permanentemente (resolve a rodada 22 com evidencia real), e
      # `apply_historical_ledger_epoch_guard()` bloqueia qualquer rodada <= 23 sem evidencia em
      # NENHUMA fonte conhecida (defesa em profundidade contra qualquer outra lacuna historica).
      #
      # Antes de rearmar, verificado: reconciliacao contra as 23 rodadas concluidas nao produz
      # NENHUM candidato de reenvio (rodadas 1-20 e 22-23 durstas com evidencia real; rodada 21
      # permanece corretamente nao-elegivel -- 4 dos 10 jogos ainda POSTPONED, sem substituicao no
      # manifesto -- e bloqueada tanto pelo guardiao de epoca quanto pela avaliacao normal de jogos,
      # nunca por estar "sem linha no ledger"). Verificado tambem diretamente contra producao
      # (leitura, sem escrita): rodadas 22/23 permanecem SENT/attempt_count=1/11 aceitos, rodada 21
      # continua sem nenhuma linha em nenhuma fonte, nenhuma linha nova inesperada apareceu.
      #
      # DESARMAR = trocar --auto por --dry-run e remover/alterar o valor de BOLAO_ALLOW_REAL_SEND.
      - name: Reconciliar rodadas (envio real de rodada completa)
        working-directory: bolao/br2026/scripts
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOLAO_ALLOW_REAL_SEND: "I UNDERSTAND"
        run: python3 send_round_email.py --auto
