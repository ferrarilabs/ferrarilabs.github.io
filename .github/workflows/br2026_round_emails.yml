name: Bolão BR2026 — Emails de rodada (auto)

on:
  schedule:
    # Every 30 min, 21:00-23:50 UTC = 6:00 PM-8:50 PM EDT (typical BR2026 evening kickoffs)
    - cron: '*/30 21-23 * * *'
    # Every 30 min, 00:00-04:50 UTC = 8:00 PM-12:50 AM EDT (covers late kickoffs + completion)
    - cron: '*/30 0-4 * * *'
  workflow_dispatch: {}

# Queue rather than cancel — avoids double-sends if jobs overlap
concurrency:
  group: br2026-round-emails
  cancel-in-progress: false

jobs:
  check-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # REARMADO em 2026-08-18 (Issue #221). O incidente original (R23 enviada 4x para os 11
      # participantes reais, 44 envios em vez de 11) tinha causa raiz em
      # `SupabaseStateRoundLedgerRepo`, que alegava durabilidade mas nunca escrevia de volta no
      # Supabase -- corrigido substituindo-o por `AtomicRoundLedgerRepo`
      # (bolao_round_notif_jobs, migracao 030_br_round_notification_durability.sql, aplicada em
      # producao) com reivindicacao atomica de linha unica. Um segundo defeito, achado durante a
      # verificacao do rollout ANTES de qualquer rodada real o alcancar, tambem foi corrigido:
      # `claim_bolao_notif_round_job` serializava reivindicacao FALHA como objeto todo-null em
      # vez de null puro -- ver commit da correcao (#228) e `test_round_email_durable_ledger.py`.
      #
      # Antes de rearmar, verificado diretamente contra producao: ledger atomico disponivel,
      # rodada 23 (a rodada do incidente) permanece SENT/11-aceitos/nao-reivindicavel, e uma
      # reivindicacao fresca contra ela devolve null (zero elegibilidade), nao por o workflow
      # estar desarmado -- pelo estado duravel do banco.
      #
      # DESARMAR = trocar --auto por --dry-run e remover/alterar o valor de BOLAO_ALLOW_REAL_SEND.
      - name: Reconciliar rodadas (envio real de rodada completa)
        working-directory: bolao/br2026/scripts
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOLAO_ALLOW_REAL_SEND: "I UNDERSTAND"
        run: python3 send_round_email.py --auto
