name: Bolão BR2026 — Emails de rodada (auto)

on:
  schedule:
    # Every 30 min, 21:00-23:50 UTC = 6:00 PM-8:50 PM EDT (typical BR2026 evening kickoffs)
    - cron: '*/30 21-23 * * *'
    # Every 30 min, 00:00-04:50 UTC = 8:00 PM-12:50 AM EDT (covers late kickoffs + completion)
    - cron: '*/30 0-4 * * *'
  workflow_dispatch: {}

# Queue rather than cancel — avoids double-sends if jobs overlap
concurrency:
  group: br2026-round-emails
  cancel-in-progress: false

jobs:
  check-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # ARMADO em 2026-08-11. As tres condicoes que este bloco exigia foram cumpridas:
      #
      #   (1) autorizacao explicita do Eduardo  dada nesta data, para a rodada 22 em diante
      #   (2) migracao 010_notification_durability.sql aplicada
      #                                         provado em execucao: "LEDGER ATOMICO: disponivel",
      #                                         job criado com idempotencyKey por rodada
      #   (3) --dry-run -> --auto e BOLAO_ALLOW_REAL_SEND devolvido
      #
      # Auditoria que precedeu o armamento (rodada 22):
      #   scoring    TRES implementacoes independentes concordam nas 11 entradas, pontos e
      #              posicoes: reimplementacao a partir da regra, o Python que monta o e-mail, e
      #              o scoreEntry/rankEntries do js/app.js que o site mostra. 0 divergencias.
      #   tabela     20 times, ranks 1..20, snapshot NAO stale, e identica a uma tabela
      #              recomputada dos 215 jogos concluidos do scoreboard -- nao e tabela velha.
      #   conteudo   10/10 jogos com placar, 11 entradas, sem PII no corpo, sem placeholder,
      #              linguagem de projecao presente. contentHash 3c16184814d9cc6a, o mesmo que
      #              a execucao em dry-run do Actions calculou.
      #
      # O caminho de reconciliacao e o CANONICO e o MESMO que envia: manifesto versionado ->
      # resolver por rodada -> ledger duravel -> portao de destinatarios. O --dry-run parava
      # antes da primeira chamada ao provedor; nao era um caminho paralelo.
      #
      # O que continua protegendo o envio, mesmo armado:
      #   rodada        so rodada canonica COMPLETA notifica; adiado de R21 nao libera nada
      #   ledger        idempotencia por rodada (br2026:round-results:<n>:v1); aceito nunca reenvia
      #   completude    destinatario sem contato bloqueia a rodada inteira, zero chamadas
      #   parcial       entrega parcial nunca vira 'sent'
      #   credencial    sem SUPABASE_SERVICE_ROLE_KEY o ledger falha FECHADO
      #
      # DESARMAR = trocar --auto por --dry-run e remover BOLAO_ALLOW_REAL_SEND. Duas travas
      # independentes, como antes.
      - name: Reconciliar rodadas (envio real de rodada completa)
        working-directory: bolao/br2026/scripts
        env:
          # N24: as RPCs de notificacao deixaram de ser executaveis por `anon`. Sem esta
          # credencial o ledger falha FECHADA -- que e o desfecho correto, nao um bug.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOLAO_ALLOW_REAL_SEND: "I UNDERSTAND"
        run: python3 send_round_email.py --auto
