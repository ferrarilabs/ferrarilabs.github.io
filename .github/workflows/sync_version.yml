name: Bolão — Sync cache-bust version in index.html

# Originally scoped to only bolao/js/config.js. Extended over time:
#
# v1: config.js only → missed CSS-only commits (users saw broken layout)
# v2: broadened to bolao/js/** + bolao/css/** → still missed br2026/cdb2026
#     because those sub-bolões used manual ?v= bumps, and forgetting to bump
#     left users with stale JS after every fix.
#
# v3 (current): covers all three bolões. On any push that touches JS or CSS
#     in any of the three bolão directories, the bot rewrites all three
#     index.html files to ?v=<commit-sha> — guaranteed unique, no manual
#     coordination needed. index.html files excluded from path trigger so
#     the bot's own commit doesn't retrigger itself.
on:
  push:
    branches: [main]
    paths:
      - 'bolao/copa2026/js/**.js'
      - 'bolao/copa2026/css/**.css'
      - 'bolao/br2026/js/**.js'
      - 'bolao/br2026/css/**.css'
      - 'bolao/cdb2026/js/**.js'
      - 'bolao/cdb2026/css/**.css'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync ?v= in all three bolão index.html files to this commit's SHA
        id: sync
        run: |
          VERSION=$(git rev-parse --short HEAD)
          echo "Cache-bust value: $VERSION"
          CHANGED=false

          for INDEX in bolao/copa2026/index.html bolao/br2026/index.html bolao/cdb2026/index.html; do
            if [ ! -f "$INDEX" ]; then
              echo "$INDEX not found — skipping"
              continue
            fi
            BEFORE=$(md5sum "$INDEX" | cut -d' ' -f1)
            sed -i "s/?v=[^\"' >]*/\?v=$VERSION/g" "$INDEX"
            AFTER=$(md5sum "$INDEX" | cut -d' ' -f1)
            if [ "$BEFORE" = "$AFTER" ]; then
              echo "$INDEX already at $VERSION — no change"
            else
              echo "Updated $INDEX to $VERSION"
              CHANGED=true
            fi
          done

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Commit updated index.html files
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add bolao/copa2026/index.html bolao/br2026/index.html bolao/cdb2026/index.html
          git commit -m "chore: bump cache-bust version in index.html [skip ci]"
          git push
