name: Bolão — Sync cache-bust version in index.html

# Was scoped to only bolao/js/config.js — meant "bump siteVersion to get a
# fresh cache-bust". Broke in practice: two concurrent sessions each pushed
# a commit claiming the same siteVersion string (v4.71) about a minute
# apart. The second one only touched styles.css, so this workflow never
# fired for it at all — index.html kept the stale "?v=4.71" pointing at a
# URL whose cached content no longer matched what was actually being
# served, and a real user (Eduardo) got stuck looking at a broken layout
# with no way to know a refresh wouldn't even help (same URL either way).
#
# Fixed two ways: (1) broadened the trigger to any source file that could
# change what index.html's cache-busted URLs serve — not just config.js —
# and (2) the cache-bust value is now the commit SHA, not the manually
# maintained siteVersion string, so it's guaranteed unique on every commit
# regardless of whether anyone remembered (or coordinated) a version bump.
# index.html itself stays out of the path list so this workflow's own
# commit doesn't retrigger itself.
on:
  push:
    branches: [main]
    paths:
      - 'bolao/js/**.js'
      - 'bolao/css/**.css'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fetch with the bot token so the push below triggers Pages deploy
          fetch-depth: 0

      - name: Sync ?v= in index.html to this commit's SHA
        id: sync
        run: |
          VERSION=$(git rev-parse --short HEAD)
          echo "Cache-bust value: $VERSION"
          BEFORE=$(md5sum bolao/index.html | cut -d' ' -f1)
          sed -i "s/?v=[^\"' >]*/\?v=$VERSION/g" bolao/index.html
          AFTER=$(md5sum bolao/index.html | cut -d' ' -f1)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "index.html already at $VERSION — nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updated index.html to $VERSION"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated index.html
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add bolao/index.html
          git commit -m "chore: bump cache-bust version in index.html [skip ci]"
          git push
