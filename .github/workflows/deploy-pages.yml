name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Fail-closed publication boundary (private-repo readiness): _site is built from the explicit
      # allowlist in scripts/public-site.manifest.json — NOT by copying the repository and excluding
      # things. Then the gate inspects the real _site; any finding fails the job BEFORE upload/deploy.
      # Node is preinstalled on ubuntu-latest and both scripts use only node builtins (no npm ci).
      - name: Build public artifact (explicit allowlist)
        run: node scripts/build-public-site.mjs --out _site --deployment-meta

      - name: Validate public artifact (security gate)
        run: node scripts/check-public-artifact.mjs --dir _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
