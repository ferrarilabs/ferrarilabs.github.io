name: Bolão CDB2026 — Vigia a tabela oficial das quartas

# POR QUE ESTE WORKFLOW EXISTE
#
# O sorteio das quartas ja aconteceu; a CBF ainda nao publicou datas e horarios. Pela regra de
# negocio o palpite NAO abre sem prazo -- sem horario nao ha o que fechar.
#
# Sem este vigia, alguem teria de PERCEBER que a CBF publicou e voltar para rodar um comando.
# Isso nao e automacao, e um alarme na cabeca de uma pessoa -- e foi exatamente essa classe de
# dependencia que fez o e-mail do Powerball de 10/08 nao sair.
#
# "Ainda nao publicaram" e estado de negocio NORMAL: sai com exit 0 e nao gera e-mail de falha.
# Payload contraditorio (confronto que nao existe no sorteio oficial) permanece vermelho.
#
# NAO ENVIA E-MAIL. So materializa datas/horarios e o prazo.

on:
  schedule:
    # De 2 em 2 horas. A publicacao pode sair a qualquer hora do dia; de 2 em 2 horas a janela
    # maxima de atraso e pequena perto do intervalo ate o primeiro jogo (semanas), e o custo por
    # execucao e uma consulta. Cadencia menor seria polling por ansiedade.
    - cron: '40 */2 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: "Materializar de verdade (sem isto, dry-run)"
        required: false
        default: false
        type: boolean
      correction:
        description: "CORRECAO DE ACESSO: rotaciona os tokens e reenvia (evento de negocio proprio)"
        required: false
        default: false
        type: boolean
      only_missing:
        description: "So quem NAO tem credencial viva (nao rotaciona quem ja esta com link bom)"
        required: false
        default: false
        type: boolean
      key_version:
        description: "Versao da chave de negocio (subir = decisao deliberada de reenviar)"
        required: false
        default: "1"
        type: string

concurrency:
  group: cdb2026-operator      # mesmo grupo do CLI de operador: os dois escrevem o mesmo estado
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Reconcilia a tabela oficial
        working-directory: bolao/cdb2026/scripts
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          MODO="--dry-run"
          [ "${{ inputs.apply }}" = "true" ] && MODO="--apply"
          # No agendado, materializa de verdade: o objetivo do vigia e a transicao acontecer
          # sozinha. O dry-run existe para o disparo manual.
          [ "${{ github.event_name }}" = "schedule" ] && MODO="--apply"
          python3 reconcile_official_schedule.py $MODO

      # O convite vem COLADO na materializacao, de proposito.
      #
      # Abrir os palpites e avisar quem pode palpitar sao a mesma acao vista de dois lados. Se
      # ficarem em workflows separados existe uma janela em que o formulario esta aberto e
      # ninguem sabe -- e desde a migracao 20260812080000 o participante NAO tem como chegar na
      # propria entrada sem o link do convite: o navegador nao enxerga mais e-mail de ninguem.
      # Abrir sem convidar seria publicar uma porta sem entregar a chave.
      #
      # Rodar sempre e seguro porque o script tem duas travas independentes:
      #   1. sem `cutoffAt` publicado ele RECUSA (regra 50) e sai com 3
      #   2. quem ja tem credencial viva nao e convidado de novo (reemitir invalidaria o link
      #      que a pessoa tem na mao)
      # Entao a execucao de duas em duas horas nao manda nada ate a tabela sair, e manda uma
      # unica vez quando sair.
      - name: Convida quando (e so quando) o prazo estiver publicado
        working-directory: bolao/cdb2026/scripts
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOLAO_ALLOW_REAL_SEND: "I UNDERSTAND"
        run: |
          set -uo pipefail
          MODO="--dry-run"
          [ "${{ inputs.apply }}" = "true" ] && MODO="--apply"
          [ "${{ github.event_name }}" = "schedule" ] && MODO="--apply"
          # `|| rc=$?` e obrigatorio: o Actions roda `bash -e {0}`, entao o `-e` vem da INVOCACAO
          # do shell e nao do `set` aqui dentro. Sem isso o passo aborta no proprio exit 3 antes
          # de chegar na linha que trata o 3 como normal -- que foi exatamente o que aconteceu na
          # primeira execucao: o script recusou corretamente e o workflow ficou vermelho mesmo
          # assim, gerando o e-mail de falha que este trabalho todo existe para eliminar.
          # A correcao e um evento de negocio SEPARADO (chave propria), entao nao herda o
          # estado terminal do convite original -- que continua `sent` e continua descrevendo
          # doze e-mails realmente entregues. O que falhou depois foi o link, nao a entrega.
          [ "${{ inputs.correction }}" = "true" ] && MODO="--apply --correction"
          [ "${{ inputs.only_missing }}" = "true" ] && MODO="$MODO --only-missing"
          MODO="$MODO --key-version ${{ inputs.key_version || '1' }}"
          rc=0
          python3 send_invitation_email.py $MODO || rc=$?
          # 3 = "ainda nao ha prazo publicado". Estado de negocio NORMAL: e o caso esperado em
          # toda execucao ate a CBF publicar. Vermelho aqui seria alarme cronico, e alarme
          # cronico e como se aprende a ignorar alarme.
          if [ $rc -eq 3 ]; then
            echo "CDB_INVITATION = aguardando tabela oficial (normal)"
            exit 0
          fi
          exit $rc
