name: Loterias — coleta de resultado e estado (Powerball + Mega Millions)

# COLETA IDEMPOTENTE. Este workflow nao envia e-mail, nao credita premio e nao compra nada:
# registra o que a fonte oficial publicou e recalcula o estado do ciclo (jackpots, elegibilidade,
# saldo) que a pagina le.
#
# ─── POR QUE TANTOS HORARIOS ─────────────────────────────────────────────────────────────────
#
# O agendador do GitHub Actions NAO garante horario: sob carga, uma janela agendada simplesmente
# nao dispara. E o resultado oficial nem sempre sai na janela da noite — em 2026-08-10 saiu depois.
#
# Por isso a corretude nao depende de nenhuma execucao especifica. `poll_results.py` responde
# sempre a mesma pergunta ("ha sorteio recente sem resultado registrado?") olhando uma janela de
# 10 dias. Rodar cedo demais nao faz nada; rodar tarde RECUPERA; rodar dez vezes registra uma vez.
# Slot perdido vira ATRASO, nunca perda.
#
# Powerball sorteia segunda/quarta/sabado 22:59 ET; Mega Millions terca/sexta 23:00 ET.
# (ET = UTC-4 no horario de verao, entao 22:59 ET vira 02:59 UTC do dia seguinte.)

on:
  schedule:
    # Powerball — noite de segunda/quarta/sabado (madrugada de UTC do dia seguinte)
    - cron: '15 3-7 * * 2,4,0'
    # Mega Millions — noite de terca/sexta
    - cron: '15 3-7 * * 3,6'
    # Recuperacao diaria: pega qualquer coisa que as janelas acima tenham perdido.
    - cron: '40 9,15,21 * * *'
  workflow_dispatch:
    inputs:
      game:
        description: 'Jogo'
        type: choice
        options: [all, powerball, megamillions]
        default: all
      reconcile:
        description: 'Reconferir o registrado contra as demais fontes'
        type: boolean
        default: false

# Um unico coletor por vez. Duas execucoes simultaneas nao corromperiam o arquivo (o append e
# reconferido), mas as duas tentariam commitar e uma perderia a corrida com um erro feio.
concurrency:
  group: lottery-poll
  cancel-in-progress: false

# O estado NAO e mais empurrado para main. Desde 2026-10-14 o ruleset `main-protection` recusa
# push direto (GH013), e este workflow seguia verde com um `::warning::` enquanto o estado da
# pagina parava em 2026-10-08 -- foi assim que a Powerball passou de US$500M sem ninguem saber.
# Agora o dado vai por PR rolante (scripts/ci/publish_data_via_pr.sh, mesmo mecanismo do #473):
#   contents: write       o branch auto/data/lottery-status (nunca main)
#   pull-requests: write  abrir/atualizar o PR rolante
#   actions: write        disparar o `npm run check` exigido no topo do branch
# O deploy roda no push do merge, como qualquer PR.
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      known: ${{ steps.aviso.outputs.known }}
      alert: ${{ steps.aviso.outputs.alert }}
      key: ${{ steps.aviso.outputs.key }}
      title: ${{ steps.aviso.outputs.title }}
      body: ${{ steps.aviso.outputs.body }}
    steps:
      - uses: actions/checkout@v5
        with:
          # O branch de dado recebe origin/main por merge; com clone raso o git nao acha a base
          # comum e recusa ("refusing to merge unrelated histories").
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prova de que este caminho nao envia e-mail nem gasta dinheiro
        run: |
          set -euo pipefail
          for F in bolao/loterias/scripts/poll_results.py bolao/loterias/scripts/lottery_status.py; do
            if grep -nEi 'emailjs|send_result_email|smtp|stripe|checkout|payment' "$F"; then
              echo "::error::$F ganhou um caminho de envio ou de pagamento"
              exit 1
            fi
          done
          echo "OK: coleta e estado seguem sem provedor e sem meio de pagamento"

      - name: Coleta de resultado (idempotente)
        run: |
          python3 bolao/loterias/scripts/poll_results.py \
            --game "${{ inputs.game || 'all' }}" \
            ${{ inputs.reconcile && '--reconcile' || '' }}

      - name: Estado do ciclo (jackpots, elegibilidade, saldo)
        run: python3 bolao/loterias/scripts/lottery_status.py

      # ANTES da publicacao: o aviso nao pode depender de o dado chegar a main.
      - name: Decidir o aviso de elegibilidade
        id: aviso
        run: |
          python3 bolao/loterias/scripts/eligibility_alert.py \
            --status bolao/loterias/config/lottery_status.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Publicar o estado via PR rolante
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # So vale um PR (e um `npm run check` de ~15 min) quando o ESTADO mudou. `generatedAt` e
          # `fetchedAt` mudam a cada execucao sem mudar nada que a pagina afirme.
          if python3 - <<'PY'
          import json, subprocess, sys
          P = "bolao/loterias/config/lottery_status.json"
          def sem_relogio(d):
              d.pop("generatedAt", None)
              for g in (d.get("games") or {}).values():
                  g.pop("fetchedAt", None)
              return d
          antes = json.loads(subprocess.run(["git", "show", f"HEAD:{P}"], capture_output=True,
                                            text=True, check=True).stdout)
          depois = json.load(open(P, encoding="utf-8"))
          res = subprocess.run(["git", "diff", "--quiet", "HEAD", "--",
                                "bolao/loterias/config/lottery_results.jsonl"])
          sys.exit(0 if sem_relogio(antes) == sem_relogio(depois) and res.returncode == 0 else 1)
          PY
          then
            echo "estado igual ao de main (so relogio mudou) — nada a publicar"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Caminhos EXPLICITOS. `git add -A` varreria qualquer outra coisa que o runner tenha
          # deixado na arvore para dentro de um commit automatico.
          git add bolao/loterias/config/lottery_results.jsonl \
                  bolao/loterias/config/lottery_status.json
          git commit -m "Auto: coleta de loteria e estado do ciclo

          Gerado por lottery_poll.yml. Nenhum e-mail enviado, nenhum premio creditado,
          nenhum bilhete comprado."
          # Falha aqui e VERMELHA: o silencio de um push recusado foi o defeito que isto corrige.
          scripts/ci/publish_data_via_pr.sh "auto/data/lottery-status" \
            "chore(loterias): estado do ciclo e resultados (automatico)" \
            "Estado das loterias (jackpots, elegibilidade, saldo) e resultados oficiais coletados por lottery_poll.yml. PR rolante: execucoes seguintes atualizam este mesmo PR. Merge somente com \`npm run check\` verde no topo atual (ruleset main-protection); o deploy do Pages roda no push do merge." \
            bolao/loterias/config/lottery_results.jsonl \
            bolao/loterias/config/lottery_status.json

  # Job separado para que `issues: write` nao seja concedido a coleta. Roda mesmo se a publicacao
  # falhar: o aviso e justamente o que nao pode depender dela.
  aviso:
    needs: coleta
    if: ${{ always() && needs.coleta.outputs.known == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Abrir ou fechar a issue de bolao elegivel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ALERT: ${{ needs.coleta.outputs.alert }}
          KEY: ${{ needs.coleta.outputs.key }}
          TITLE: ${{ needs.coleta.outputs.title }}
          BODY: ${{ needs.coleta.outputs.body }}
          OPERADOR: eduardomferrari
        run: |
          set -euo pipefail
          LABEL=bolao-elegivel
          gh label create "$LABEL" --color D93F0B \
            --description "Jackpot acima do limiar sem bolao aberto (lottery_poll.yml)" 2>/dev/null || true
          # Uma issue por pool (jogo + data). Fecha as que nao valem mais: bolao aberto, jackpot
          # abaixo do limiar ou sorteio que ja passou.
          gh issue list --label "$LABEL" --state open --json number,title \
            --jq '.[] | "\(.number)\t\(.title)"' | while IFS=$'\t' read -r N T; do
            if [ "$ALERT" != "true" ] || [[ "$T" != "$KEY"* ]]; then
              gh issue close "$N" --comment "Resolvido pelo lottery_poll.yml: o pool deste aviso nao esta mais pendente (bolao aberto, jackpot abaixo do limiar ou sorteio encerrado)."
            fi
          done
          if [ "$ALERT" = "true" ]; then
            if gh issue list --label "$LABEL" --state open --json title \
                 --jq "[.[] | select(.title | startswith(\"$KEY\"))] | length" | grep -qx '[1-9][0-9]*'; then
              echo "aviso $KEY ja aberto — nada a fazer"
            else
              gh issue create --title "$TITLE" --body "$BODY" --label "$LABEL" --assignee "$OPERADOR"
            fi
          fi
