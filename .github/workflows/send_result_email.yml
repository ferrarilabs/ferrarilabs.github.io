name: Bolão — Atualizar resultado e enviar email

on:
  workflow_dispatch:
    inputs:
      match_id:
        description: "Número do jogo (ex: 79)"
        required: true
        type: string
      goals_a:
        description: "Gols time A (ex: 2)"
        required: true
        type: string
      goals_b:
        description: "Gols time B (ex: 1)"
        required: true
        type: string
      advance_side:
        description: "Quem avança (A ou B)"
        required: true
        type: choice
        options: [A, B]

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run update + send
        working-directory: bolao-teste/scripts
        run: |
          python3 send_result_email.py \
            --update "${{ github.event.inputs.match_id }}" \
                     "${{ github.event.inputs.goals_a }}" \
                     "${{ github.event.inputs.goals_b }}" \
                     "${{ github.event.inputs.advance_side }}"
          python3 send_result_email.py
