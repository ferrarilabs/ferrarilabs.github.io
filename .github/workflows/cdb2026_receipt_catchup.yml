# Recuperação ÚNICA de comprovantes (2026-08-12). Duas entradas:
#   medir   -> só leitura, classifica e congela o manifesto. Incapaz de enviar.
#   enviar  -> remede, exige manifesto idêntico, envia uma vez por alvo.
# `BOLAO_ALLOW_REAL_SEND` só existe no job de envio.
name: CDB2026 — recuperação de comprovantes (2026-08-12)

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "medir (só leitura) ou enviar"
        required: true
        default: medir
        type: choice
        options: [medir, enviar]

permissions:
  contents: read

concurrency:
  group: cdb2026-receipt-catchup
  cancel-in-progress: false

jobs:
  medir:
    if: inputs.acao == 'medir'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Medir quem salvou hoje
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 bolao/cdb2026/scripts/receipt_catchup.py --medir

  enviar:
    if: inputs.acao == 'enviar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Prova do comprovante (sem rede)
        run: python3 bolao/cdb2026/scripts/test_receipt.py
      - name: Enviar a recuperação
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOLAO_ALLOW_REAL_SEND: "I UNDERSTAND"
        run: python3 bolao/cdb2026/scripts/receipt_catchup.py --enviar --approve HUMAN_APPROVED
