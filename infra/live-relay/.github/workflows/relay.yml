# live-relay — roda em repositório PÚBLICO (minutos de Actions gratuitos), acordado pelo Worker da
# Cloudflare via workflow_dispatch. Não tem cron próprio: o GitHub não honra cadência de 5 min.
name: live-relay

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só simular (a função valida e responde, sem gravar)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: live-relay
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Relay ESPN -> live-cache-ingest
        env:
          INGEST_URL: ${{ vars.INGEST_URL }}
          LIVE_INGEST_TOKEN: ${{ secrets.LIVE_INGEST_TOKEN }}
        run: |
          ARGS="--loop"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="--dry-run"
          node relay.mjs $ARGS
